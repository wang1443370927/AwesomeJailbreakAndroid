name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Unzip Project and Build
        run: |
          unzip -q AwesomeJailbreakAndroid_Project.zip
          
          # 暴力寻找 gradlew（最多找 4 层目录深度）
          PROJECT_DIR=$(find . -maxdepth 4 -name "gradlew" -printf '%h\n' | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: 依然找不到 gradlew！"
            echo "当前目录结构如下："
            # 如果还找不到，把解压出来的文件夹里的东西全部打印出来看看
            find AwesomeJailbreakAndroid -maxdepth 3
            exit 1
          fi
          
          echo "找到项目目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          chmod +x gradlew || true
          
          if [ -f "gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: "**/build/outputs/apk/debug/*.apk"
