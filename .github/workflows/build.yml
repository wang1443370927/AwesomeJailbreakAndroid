name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Unzip Project and Build
        run: |
          unzip -q AwesomeJailbreakAndroid_Project.zip
          
          # 自动寻找包含 gradlew 的目录并进入（防错机制：不管文件夹叫什么都能找到）
          PROJECT_DIR=$(find . -maxdepth 2 -name "gradlew" -printf '%h\n' | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: 找不到包含 gradlew 的 Android 项目目录！"
            ls -la
            exit 1
          fi
          
          echo "找到项目目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # 赋予执行权限
          chmod +x gradlew || true
          
          # 开始编译
          if [ -f "gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: "**/build/outputs/apk/debug/*.apk"
